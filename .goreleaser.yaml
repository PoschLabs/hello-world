version: 2

project_name: hello-world

builds:
  - id: hello-world
    builder: rust
    binary: hello-world
    flags:
      - --release
    targets:
      - x86_64-unknown-linux-gnu

archives:
  - id: hello-world
    ids:
      - hello-world
    formats:
      - tar.gz

nfpms:
  - id: linux-packages
    package_name: hello-world
    ids:
      - hello-world

    release: 1

    vendor: PoschLabs
    homepage: https://github.com/PoschLabs/hello-world
    maintainer: PoschLabs
    description: |
      Hello World is a minimal Rust application used to
      demonstrate automated builds, packaging, signing,
      and publishing of Linux software packages.
    license: MIT

    formats:
      - deb
      - rpm

    bindir: /usr/bin

    # Package metadata
    section: utils
    priority: optional

    # Additional package contents
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/hello-world/LICENSE
        type: license

checksum:
  name_template: checksums.txt

release:
  github:
    owner: PoschLabs
    name: hello-world
